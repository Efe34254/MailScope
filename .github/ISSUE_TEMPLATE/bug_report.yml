name: Bug report
description: Report reproducible MailScope behavior using synthetic or redacted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real emails, credentials, malware samples, customer data or unredacted logs.
  - type: input
    id: version
    attributes:
      label: MailScope version or commit
      placeholder: v1.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Analyze
        - Cases
        - Indicators
        - Intelligence providers
        - Reports
        - Settings, backup or retention
        - Build or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or safely redacted inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys, personal data, real email content, device paths and unredacted indicators.
          required: true
        - label: This report is not a security vulnerability requiring private disclosure.
          required: true
