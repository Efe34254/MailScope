name: Feature request
description: Propose a privacy-preserving static email-analysis improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What analyst problem should MailScope solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Security and privacy effects
      description: Describe new parsing, storage, credentials, network requests or uploads.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Product boundary
      options:
        - label: This proposal preserves MailScope's static-analysis-only desktop boundary.
          required: true
