name: Signed Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build signed artifacts and create draft release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:GITHUB_REF_NAME"
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content apps/desktop/src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $buildVersion = [regex]::Match((Get-Content scripts/build.ps1 -Raw), "(?m)^`$Version\s*=\s*'([^']+)'").Groups[1].Value
          $versions = @(@($packageVersion, $tauriVersion, $cargoVersion, $buildVersion) | Select-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $version) {
            throw "Tag/project version mismatch. Tag=$version project=$($versions -join ',')"
          }
          "MAILSCOPE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require and import Windows code-signing certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Signing secrets are missing. Refusing to create an unsigned public release.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mailscope-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          "SIGNING_CERTIFICATE_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or -not $certificate.Thumbprint) { throw 'Code-signing certificate import failed.' }
          "MAILSCOPE_SIGN_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Pin npm for Windows reliability
        run: npm install --global npm@10.9.3

      - name: Select stable Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-msvc --profile minimal
          rustup default stable-msvc

      - name: Prepare verified dependencies and run tests
        shell: pwsh
        run: ./scripts/setup.ps1

      - name: Build signed installer and portable package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify signed release output
        shell: pwsh
        run: |
          $version = $env:MAILSCOPE_RELEASE_VERSION
          $installer = "output/MailScope_Setup_$version.exe"
          $portable = "output/MailScope_Portable_$version.zip"
          foreach ($path in @($installer, $portable, 'output/SHA256SUMS.txt', 'output/release-manifest.json')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release artifact: $path" }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status)" }
          $manifest = Get-Content output/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.installer.authenticode -ne 'Valid' -or $manifest.portable.application_authenticode -ne 'Valid') {
            throw 'Release manifest does not confirm valid application and installer signatures.'
          }

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:MAILSCOPE_RELEASE_VERSION
          gh release create $env:GITHUB_REF_NAME `
            "output/MailScope_Setup_$version.exe" `
            "output/MailScope_Portable_$version.zip" `
            'output/SHA256SUMS.txt' `
            'output/release-manifest.json' `
            --verify-tag `
            --draft `
            --generate-notes `
            --title "MailScope $env:GITHUB_REF_NAME"

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:MAILSCOPE_SIGN_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:MAILSCOPE_SIGN_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          if ($env:SIGNING_CERTIFICATE_PATH) {
            Remove-Item -LiteralPath $env:SIGNING_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
