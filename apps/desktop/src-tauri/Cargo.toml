[package]
name = "mailscope"
version = "1.1.0"
description = "Privacy-first email analysis desktop application"
authors = ["MailScope"]
edition = "2021"

[lib]
name = "mailscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
